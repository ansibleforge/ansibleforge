# Must stay in lockstep with the channel in ocp/gitops/aap/templates/operator.yaml.
# AAP CRDs are cluster-scoped and shared with the platform install in the aap
# namespace; whichever operator upgrades last owns the CRD versions for both.
operatorChannel: stable-2.7

# One entry per customer tenancy. Each gets a namespace, quota, a
# namespace-scoped Argo CD instance, and its own AAP operator install.
tenants:
  - name: customer1-aap
    # OpenShift group whose members administer the tenant Argo CD instance
    # and the namespace. The Group object is chart-managed; list member
    # usernames in adminUsers.
    adminGroup: customer1-aap-admins
    adminUsers:
      - hfenner
    quota:
      requestsCpu: "6"
      requestsMemory: 20Gi
      # Limits caps sized for the AAP operator suite's generous per-pod
      # limits (11.5 CPU of limits against 740m of actual requests); the
      # requests caps above are what actually protect node capacity.
      limitsCpu: "24"
      limitsMemory: 48Gi
      pods: "60"
