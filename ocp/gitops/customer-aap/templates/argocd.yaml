{{- range .Values.tenants }}
---
# Namespace-scoped instance: the GitOps operator grants its service accounts
# permissions in this namespace only, so tenant applications cannot create
# cluster-scoped resources or deploy outside the namespace.
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: argocd
  namespace: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  sso:
    provider: dex
    dex:
      openShiftOAuth: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi
  rbac:
    defaultPolicy: ""
    policy: |
      g, {{ .adminGroup }}, role:admin
    scopes: "[groups]"
  server:
    route:
      enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  controller:
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
  repo:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  redis:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
{{- end }}
