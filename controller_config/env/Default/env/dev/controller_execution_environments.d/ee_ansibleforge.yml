---
# Two execution environments from one source tree.
#
# "EE AnsibleForge" is the canary: built from the UNPINNED requirements.yaml, so
# it picks up whatever upstream published today. When a collection regresses it
# should break here first, on work that does not matter.
#
# WARNING: nothing currently runs on the canary — every job template moved to
# the pinned EE. An unexercised canary warns about nothing, so upstream
# regressions will now surface only when someone bumps the pinned versions.
# Give it a consumer (a scheduled smoke test, or the CI lint template) to get
# the early-warning value back.
#
# "EE AnsibleForge (pinned)" is built from requirements-pinned.* and is what
# production job templates should run. The :pinned tag only moves when someone
# edits the pinned requirements, which is a reviewable commit; to roll back,
# point this at a previous ee-ansibleforge:pinned-<sha>.
#
# Moving a job template between the two is the upgrade gate: run it on the
# canary, confirm it passes, then bump the pin.
controller_execution_environments:
  - name: EE AnsibleForge
    image: "image-registry.openshift-image-registry.svc:5000/shared-builds/ee-ansibleforge:latest"
    pull: missing

  - name: EE AnsibleForge (pinned)
    image: "image-registry.openshift-image-registry.svc:5000/shared-builds/ee-ansibleforge:pinned"
    pull: missing
