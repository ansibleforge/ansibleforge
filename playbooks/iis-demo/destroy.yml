---
- name: Destroy IIS demo EC2 instance
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aws_region: us-east-2
    vm_name: "iis-demo"

  tasks:
    - name: Find instance by tag
      amazon.aws.ec2_instance_info:
        region: "{{ aws_region }}"
        filters:
          "tag:Role": iis-demo
          "instance-state-name": ["pending", "running", "stopped", "stopping"]
      register: _matches

    - name: Terminate instance
      amazon.aws.ec2_instance:
        region: "{{ aws_region }}"
        instance_ids: "{{ _matches.instances | map(attribute='instance_id') | list }}"
        state: absent
      when: _matches.instances | length > 0

    # AWS bills for an Elastic IP that is allocated but not associated, so
    # terminating the instance without releasing the EIP leaves a silent
    # charge behind.
    - name: Find the iis-demo Elastic IP
      amazon.aws.ec2_eip_info:
        region: "{{ aws_region }}"
        filters:
          "tag:Role": iis-demo
      register: _eips

    - name: Release the Elastic IP
      amazon.aws.ec2_eip:
        region: "{{ aws_region }}"
        public_ip: "{{ item.public_ip }}"
        state: absent
      loop: "{{ _eips.addresses | default([]) }}"
      loop_control:
        label: "{{ item.public_ip }}"

    - name: Report
      ansible.builtin.debug:
        msg: >-
          Terminated {{ _matches.instances | length }} iis-demo instance(s);
          released {{ _eips.addresses | default([]) | length }} Elastic IP(s).
