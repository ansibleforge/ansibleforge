---
# Drops a fail.flag in the IIS webroot so /health.aspx starts returning 500.
# EDA polls /health.aspx and fires the restart JT on detecting the 500.
#
# Address comes from the "VM Portal - AWS" dynamic inventory rather than a
# static IIS_HOST -- see restart.yml for the rationale.
- name: Validate the run
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Assert the IIS admin password is present
      ansible.builtin.assert:
        that:
          - lookup('env', 'IIS_ADMIN_PASSWORD') | length > 0
        fail_msg: >-
          Attach the "IIS Demo Secrets" credential to this job template so
          IIS_ADMIN_PASSWORD is injected as an env var.

    - name: Require the iis-demo host in this job's inventory
      ansible.builtin.assert:
        that:
          - "'iis-demo' in groups['all']"
        fail_msg: >-
          No 'iis-demo' host in this job's inventory. Run this template against
          the "VM Portal - AWS" inventory, which resolves the host's current
          public address from AWS.

- name: Write fail.flag on IIS host
  hosts: iis-demo
  gather_facts: false

  vars_files:
    - vars/winrm_connection.yml

  tasks:
    - name: Create fail.flag (makes /health.aspx return 500)
      ansible.windows.win_copy:
        content: "trigger"
        dest: 'C:\inetpub\wwwroot\fail.flag'

    - name: Report
      ansible.builtin.debug:
        msg: >-
          fail.flag written on {{ inventory_hostname }} ({{ ansible_host }}).
          /health.aspx will now return 500. EDA should detect and restart within ~10s.
