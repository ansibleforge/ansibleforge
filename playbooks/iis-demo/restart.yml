---
# Clears fail.flag, increments the restart counter, and does iisreset.
# Invoked by the EDA rulebook on health failure, but also launchable manually.
#
# The host comes from the "VM Portal - AWS" dynamic inventory, so a rebuilt or
# restarted instance is picked up on the next sync rather than every run
# failing against a stale address.
#
# Connection is SSH over the instance's PRIVATE address (see
# vars/ssh_connection.yml) using the "IIS Demo - SSH" machine credential. No
# password is involved, so IIS_ADMIN_PASSWORD is no longer needed here.
- name: Validate the run
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    # Without this, running against the wrong inventory matches no hosts and
    # the job reports success having done nothing at all.
    - name: Require the iis-demo host in this job's inventory
      ansible.builtin.assert:
        that:
          - "'iis-demo' in groups['all']"
        fail_msg: >-
          No 'iis-demo' host in this job's inventory. Run this template against
          the "VM Portal - AWS" inventory, which resolves the host's current
          public address from AWS.

- name: Heal IIS
  hosts: iis-demo
  gather_facts: false

  vars_files:
    - vars/ssh_connection.yml

  tasks:
    - name: Remove fail.flag
      ansible.windows.win_file:
        path: 'C:\inetpub\wwwroot\fail.flag'
        state: absent

    - name: Increment restart counter
      ansible.windows.win_shell: |
        $path = 'C:\inetpub\wwwroot\restartcount.txt'
        $count = 0
        if (Test-Path $path) { $count = [int](Get-Content $path -Raw).Trim() }
        ($count + 1) | Set-Content -Path $path -Encoding ASCII
        Write-Output ($count + 1)
      register: _new_count
      changed_when: true

    - name: Reset IIS
      ansible.windows.win_shell: iisreset
      changed_when: true

    - name: Report
      ansible.builtin.debug:
        msg: >-
          IIS restarted on {{ inventory_hostname }} ({{ ansible_host }}).
          New restart count: {{ _new_count.stdout | trim }}
