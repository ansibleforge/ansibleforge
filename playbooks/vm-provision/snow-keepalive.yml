---
# Periodic ping against the ServiceNow developer instance to keep it
# awake and to detect hibernation early. Run on a schedule (every ~30
# min). A successful 200 + JSON body means SNOW is reachable; the
# "Instance Hibernating" HTML page is reported and a wake-up is fired
# (reachable, non-failing). But a genuinely UNREACHABLE instance (no HTTP
# response — connection timeout/refused, status -1) fails the job, so a
# dead/reclaimed instance surfaces instead of hiding behind green runs.
# NOTE: automated wake cannot revive a hibernated dev instance (that needs
# an interactive developer.servicenow.com login); when the instance is
# knowingly down long-term, disable the "SN Keepalive" schedule.
- name: ServiceNow keepalive ping
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    sn_host: "{{ lookup('env', 'SN_HOST') }}"
    sn_username: "{{ lookup('env', 'SN_USERNAME') }}"
    sn_password: "{{ lookup('env', 'SN_PASSWORD') }}"

  tasks:
    - name: Assert SN credentials are present
      ansible.builtin.assert:
        that:
          - sn_host | length > 0
          - sn_username | length > 0
          - sn_password | length > 0
        fail_msg: Attach the "ServiceNow" credential to this job template.

    - name: Ping SNOW table API
      ansible.builtin.uri:
        url: "{{ sn_host }}/api/now/table/sys_user?sysparm_limit=1&sysparm_fields=sys_id"
        method: GET
        user: "{{ sn_username }}"
        password: "{{ sn_password }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Accept: application/json
        return_content: true
        status_code: [200, 401, 403, 502, 503, 504]
        timeout: 30
      register: _ping
      failed_when: false

    - name: Wake hibernated instance via dev portal endpoint
      ansible.builtin.uri:
        url: "{{ sn_host }}/dev.do?wu=true"
        method: GET
        validate_certs: false
        timeout: 30
        status_code: [200, 302, 401, 403]
      register: _wakeup
      failed_when: false
      when:
        - _ping.content is defined
        - "'Instance Hibernating' in (_ping.content | default(''))"

    - name: Report SNOW state
      ansible.builtin.debug:
        msg: >-
          {% if _ping.status == 200 and _ping.json is defined %}
          SNOW awake — table API responded 200 with JSON.
          {% elif _ping.content is defined and 'Instance Hibernating' in _ping.content %}
          SNOW is hibernating — wake-up request fired (status={{ _wakeup.status | default('?') }}).
          {% else %}
          SNOW unreachable — status={{ _ping.status | default('?') }}, will retry next schedule.
          {% endif %}

    # Reachable-but-hibernating still counts as "up enough" (wake fired);
    # only a total non-response (no reachable API, no hibernation page) is a
    # real failure worth surfacing.
    - name: Fail when ServiceNow is unreachable
      ansible.builtin.fail:
        msg: >-
          ServiceNow keepalive could not reach {{ sn_host }}
          (status={{ _ping.status | default('-1') }}). The developer instance
          is down/reclaimed and the automated wake cannot revive it — log in
          to developer.servicenow.com to wake or re-request it, then update
          Vault secret/servicenow if the URL changed. Disable the "SN
          Keepalive" schedule while the instance is knowingly down.
      when:
        - not (_ping.status | default(-1) == 200 and _ping.json is defined)
        - not (_ping.content is defined and 'Instance Hibernating' in (_ping.content | default('')))
